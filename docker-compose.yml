# Production-shaped base config (ADR-021). Compose automatically merges
# docker-compose.override.yml on top of this whenever you run plain
# `docker compose up` -- local dev workflow (ADR-011) is unchanged. To run
# ONLY what's defined here (the lean, deployable shape -- no source mounts,
# no dev servers), explicitly exclude the override file:
#   docker compose -f docker-compose.yml up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxapp}
      POSTGRES_DB: ${POSTGRES_DB:-taxapp}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # No command override, no source volume -- runs the Dockerfile's own
    # CMD (plain `uvicorn app.main:app`, no --reload) against the image
    # exactly as built. Dev-only overrides live in docker-compose.override.yml.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxapp}:${POSTGRES_PASSWORD:-taxapp}@db:5432/${POSTGRES_DB:-taxapp}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # No target specified here -- Compose builds the LAST stage by
      # default, which is `runner`: the actual compiled, optimized Next.js
      # standalone output (see frontend/Dockerfile). Dev overrides this to
      # the `deps` stage in docker-compose.override.yml.
    restart: unless-stopped
    # No command override, no source volume -- runs the Dockerfile's own
    # CMD (`node server.js`, the built standalone server), not `next dev`.
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
